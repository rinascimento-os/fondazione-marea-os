[build]
  command = "npm run build"
  publish = "dist"

[functions."showcase-snapshot"]
  schedule = "@daily"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://canuerhpoelwgozjxfrh.supabase.co; img-src 'self' data: https://canuerhpoelwgozjxfrh.supabase.co"
